<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:botones="jakarta.faces.composite/botones"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">#{tradcrud['entidad.descuento']}</ui:define>

    <ui:define name="contenido">

        <!-- ===== LISTADO DE DESCUENTOS ===== -->
        <h:form id="frmListado">
            <h:panelGroup id="pnlListado" layout="block">
                <p:dataTable id="tblListado" value="#{descuentoModel.lazyModel}" var="fila"
                             lazy="true" paginator="true" rows="10"
                             rowsPerPageTemplate="5,10,25"
                             paginatorPosition="bottom"
                             selectionMode="single"
                             emptyMessage="#{tradcrud['jsf.crud.sinRegistros']}"
                             rendered="#{descuentoModel.estado == 'NINGUNO'}">
                    <f:facet name="header">
                        #{tradcrud['jsf.crud.ayudaSeleccion']}
                    </f:facet>
                    <p:ajax event="rowSelect" listener="#{descuentoModel.onRowSelect}"
                            update=":frmMantenimiento:pnlDetalle :frmListado:pnlListado"/>

                    <p:column headerText="ID Descuento">
                        <h:outputText value="#{fila.idDescuento}"/>
                    </p:column>
                    <p:column headerText="Nombre">
                        <h:outputText value="#{fila.nombre}"/>
                    </p:column>
                    <p:column headerText="Tipo Descuento">
                        <h:outputText value="#{etiquetas.tipoDescuento(fila.idTipoDescuento)}"/>
                    </p:column>
                    <p:column headerText="Fecha Inicio">
                        <h:outputText value="#{fila.fechaDesde}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" timeZone="America/El_Salvador"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Fecha Finalización">
                        <h:outputText value="#{fila.fechaHasta}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" timeZone="America/El_Salvador"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Observaciones">
                        <h:outputText value="#{fila.observaciones}"/>
                    </p:column>
                </p:dataTable>

                <botones:botones-arriba modelo="#{descuentoModel}"
                                        actualizarListado=":frmListado:pnlListado"
                                        actualizarDetalle=":frmMantenimiento:pnlDetalle"/>
            </h:panelGroup>
        </h:form>

        <!-- ===== FORMULARIO DE MANTENIMIENTO ===== -->
        <h:form id="frmMantenimiento">
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:panelGroup rendered="#{descuentoModel.estado != 'NINGUNO'}" layout="block" styleClass="formulario-cafe">
                    <h2>#{tradcrud['jsf.crud.mantenimiento']} #{descuentoModel.nombreBean()}</h2>

                    <p:panelGrid columns="2" styleClass="ui-noborder grid-formulario">
                        <p:outputLabel value="ID" for="id"/>
                        <p:inputText id="id" value="#{descuentoModel.registro.idDescuento}" disabled="true"/>

                        <p:outputLabel value="Nombre" for="nombre"/>
                        <p:inputText id="nombre" value="#{descuentoModel.registro.nombre}"/>

                        <p:outputLabel value="Tipo de Descuento *" for="idTipoDescuento"/>
                        <p:selectOneMenu id="idTipoDescuento"
                                            value="#{descuentoModel.registro.idTipoDescuento}"
                                            converter="#{entidadConverter}"
                                            disabled="#{descuentoModel.estado ne 'CREAR'}"
                                            required="true">
                            <f:selectItem itemLabel="#{tradcrud['jsf.crud.seleccione']}" 
                                          itemValue="#{null}" 
                                          noSelectionOption="true"/>
                            <f:selectItems value="#{descuentoModel.opcionesIdTipoDescuento}"/>
                        </p:selectOneMenu>

                        <p:outputLabel value="Fecha de Inicio" for="fechaDesde"/>
                        <p:datePicker id="fechaDesde" value="#{descuentoModel.registro.fechaDesde}" 
                                      showTime="true" hideOnDateTimeSelect="true" pattern="dd/MM/yyyy HH:mm:ss"/>

                        <p:outputLabel value="Fecha de Finalización" for="fechaHasta"/>
                        <p:datePicker id="fechaHasta" value="#{descuentoModel.registro.fechaHasta}" 
                                      showTime="true" hideOnDateTimeSelect="true" pattern="dd/MM/yyyy HH:mm:ss"/>

                        <p:outputLabel value="Observaciones" for="observaciones"/>
                        <p:inputTextarea id="observaciones" value="#{descuentoModel.registro.observaciones}" 
                                         rows="3" autoResize="false"/>
                    </p:panelGrid>

                    <botones:botones-abajo modelo="#{descuentoModel}"
                                           procesar=":frmMantenimiento:pnlDetalle"
                                           actualizarListado=":frmListado:pnlListado"
                                           actualizarDetalle=":frmMantenimiento:pnlDetalle"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>

    </ui:define>

</ui:composition>
