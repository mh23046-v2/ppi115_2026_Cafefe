<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:botones="jakarta.faces.composite/botones"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">#{tradcrud['entidad.tipoCaracteristica']}</ui:define>

    <ui:define name="contenido">

        <!-- ===== LISTADO (visible cuando estado == NINGUNO) ===== -->
        <h:form id="frmListado">
            <h:panelGroup id="pnlListado" layout="block">
                <p:dataTable id="tblListado" value="#{tipoCaracteristicaModel.lazyModel}" var="fila"
                             lazy="true" paginator="true" rows="10"
                             rowsPerPageTemplate="5,10,25"
                             paginatorPosition="bottom"
                             selectionMode="single"
                             emptyMessage="#{tradcrud['jsf.crud.sinRegistros']}"
                             rendered="#{tipoCaracteristicaModel.estado == 'NINGUNO'}">
                    <f:facet name="header">
                        #{tradcrud['jsf.crud.ayudaSeleccion']}
                    </f:facet>
                    <p:ajax event="rowSelect" listener="#{tipoCaracteristicaModel.onRowSelect}"
                            update=":frmMantenimiento:pnlDetalle :frmListado:pnlListado"/>
                    <p:column headerText="ID">
                        <h:outputText value="#{fila.idTipoCaracteristica}"/>
                    </p:column>
                    <p:column headerText="Nombre">
                        <h:outputText value="#{fila.nombre}"/>
                    </p:column>
                    <p:column headerText="Expresión regular">
                        <h:outputText value="#{fila.expresionRegular}"/>
                    </p:column>
                    <p:column headerText="Activo">
                        <h:outputText value="#{fila.activo ? 'Sí' : 'No'}"/>
                    </p:column>
                    <p:column headerText="Observaciones">
                        <h:outputText value="#{fila.observaciones}"/>
                    </p:column>
                </p:dataTable>

                <botones:botones-arriba modelo="#{tipoCaracteristicaModel}"
                                        actualizarListado=":frmListado:pnlListado"
                                        actualizarDetalle=":frmMantenimiento:pnlDetalle"/>
            </h:panelGroup>
        </h:form>

        <!-- ===== FORMULARIO (visible cuando estado == CREAR o MODIFICAR) ===== -->
        <h:form id="frmMantenimiento">
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:panelGroup rendered="#{tipoCaracteristicaModel.estado != 'NINGUNO'}" layout="block" styleClass="formulario-cafe">
                    <h2>#{tradcrud['jsf.crud.mantenimiento']} #{tipoCaracteristicaModel.nombreBean()}</h2>

                    <p:panelGrid columns="2" styleClass="ui-noborder grid-formulario">
                        
                        <p:outputLabel value="ID" for="idTipoCaracteristica"/>
                        <p:inputText id="idTipoCaracteristica" value="#{tipoCaracteristicaModel.registro.idTipoCaracteristica}" disabled="true"/>
                        
                        <p:outputLabel value="Nombre" for="nombre"/>
                        <p:inputText id="nombre" value="#{tipoCaracteristicaModel.registro.nombre}"
                                     required="true" requiredMessage="El campo de nombre es obligatorio"
                                     maxlength="155"/>

                        <p:outputLabel value="Expresión regular" for="expresionRegular"/>
                        <p:inputText id="expresionRegular" value="#{tipoCaracteristicaModel.registro.expresionRegular}"
                                        validator="#{tipoCaracteristicaModel.validarExpresionRegular}"/>
                        <p:outputLabel value="Activo" for="activo"/>
                        <p:toggleSwitch id="activo" value="#{tipoCaracteristicaModel.registro.activo}" onIcon = "pi pi-check" offIcon="pi pi-times" styleClass="check-cafe"/>

                        <p:outputLabel value="Observaciones" for="observaciones"/>
                        <p:inputTextarea id="observaciones" value="#{tipoCaracteristicaModel.registro.observaciones}" rows="3" autoResize="false"/>
                    </p:panelGrid>

                    <botones:botones-abajo modelo="#{tipoCaracteristicaModel}"
                                           actualizarListado=":frmListado:pnlListado"
                                           actualizarDetalle=":frmMantenimiento:pnlDetalle"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>

    </ui:define>

</ui:composition>
