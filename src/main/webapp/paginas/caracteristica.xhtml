<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:botones="jakarta.faces.composite/botones"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="leyenda">#{tradcrud['entidad.caracteristica']}</ui:define>

    <ui:define name="contenido">

        <!-- ===== LISTADO (visible cuando estado == NINGUNO) ===== -->
        <h:form id="frmListado">
            <h:panelGroup id="pnlListado" layout="block">
                <p:dataTable id="tblListado" value="#{caracteristicaModel.lazyModel}" var="fila"
                             lazy="true" paginator="true" rows="10"
                             rowsPerPageTemplate="5,10,25"
                             paginatorPosition="bottom"
                             selectionMode="single"
                             emptyMessage="#{tradcrud['jsf.crud.sinRegistros']}"
                             rendered="#{caracteristicaModel.estado == 'NINGUNO'}">
                    <f:facet name="header">
                        #{tradcrud['jsf.crud.ayudaSeleccion']}
                    </f:facet>
                    <p:ajax event="rowSelect" listener="#{caracteristicaModel.onRowSelect}"
                            update=":frmMantenimiento:pnlDetalle :frmListado:pnlListado"
                            resetValues="true"/>
                    <p:column headerText="ID">
                        <h:outputText value="#{fila.idCaracteristica}"/>
                    </p:column>
                    <p:column headerText="Nombre">
                        <h:outputText value="#{fila.nombre}"/>
                    </p:column>
                    <p:column headerText="Tipo">
                        <h:outputText value="#{etiquetas.tipoCaracteristica(fila.idTipoCaracteristica)}"/>
                    </p:column>
                    <p:column headerText="Activo">
                        <h:outputText value="#{fila.activo ? 'Sí' : 'No'}"/>
                    </p:column>
                    <p:column headerText="Observaciones">
                        <h:outputText value="#{fila.observaciones}"/>
                    </p:column>
                </p:dataTable>

                <botones:botones-arriba modelo="#{caracteristicaModel}"
                                        actualizarListado=":frmListado:pnlListado"
                                        actualizarDetalle=":frmMantenimiento:pnlDetalle"/>
            </h:panelGroup>
        </h:form>

        <!-- ===== FORMULARIO (visible cuando estado == CREAR o MODIFICAR) ===== -->
        <h:form id="frmMantenimiento">
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:panelGroup rendered="#{caracteristicaModel.estado != 'NINGUNO'}" layout="block" styleClass="formulario-cafe">
                    <h2>#{tradcrud['jsf.crud.mantenimiento']} #{caracteristicaModel.nombreBean()}</h2>

                    <p:panelGrid columns="2" styleClass="ui-noborder grid-formulario">

                        <p:outputLabel value="ID" for="idcaracteristica"/>
                        <p:inputText id="idcaracteristica" value="#{caracteristicaModel.registro.idCaracteristica}" disabled="true"/>

                        <p:outputLabel value="Nombre" for="nombre"/>
                        <p:inputText id="nombre" value="#{caracteristicaModel.registro.nombre}"
                                     required="true" requiredMessage="El campo de nombre es obligatorio"
                                     maxlength="155"/>

                        <p:outputLabel value="Tipo de característica" for="idTipoCaracteristica"/>
                        <p:selectOneMenu id="idTipoCaracteristica" value="#{caracteristicaModel.registro.idTipoCaracteristica}" converter="#{entidadConverter}"
                                         required="true" requiredMessage="El tipo de característica es obligatorio"
                                         filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="#{tradcrud['jsf.crud.seleccione']}"
                                          itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{caracteristicaModel.opcionesIdTipoCaracteristica}"/>
                        </p:selectOneMenu>

                        <p:outputLabel value="Activo" for="activo"/>
                        <p:selectBooleanCheckbox id="activo" value="#{caracteristicaModel.registro.activo}" styleClass="check-cafe"/>

                        <p:outputLabel value="Observaciones" for="observaciones"/>
                        <p:inputTextarea id="observaciones" value="#{caracteristicaModel.registro.observaciones}" rows="3" autoResize="false"/>
                    </p:panelGrid>

                    <botones:botones-abajo modelo="#{caracteristicaModel}"
                                           actualizarListado=":frmListado:pnlListado"
                                           actualizarDetalle=":frmMantenimiento:pnlDetalle"/>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>

    </ui:define>

</ui:composition>
